[workspace]
resolver = "2"
members = [
    "crates/lootsmith-core",
    "crates/lootsmith-cli",
    "crates/lootsmith-gui",
    "crates/lootsmith",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "Zlib"
authors = ["Lootsmith contributors"]

[workspace.dependencies]
lootsmith-core = { path = "crates/lootsmith-core" }

[profile.release]
lto = "thin"
