[package]
name = "lootsmith-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lootsmith_gui"
path = "src/lib.rs"

[[bin]]
name = "lootsmith-gui"
path = "src/main.rs"

[dependencies]
lootsmith-core = { workspace = true }
eframe = { version = "0.36", features = ["persistence"] }
egui_extras = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
