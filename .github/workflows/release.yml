name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p lootsmith-gui -p lootsmith-cli
      - name: Tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C target/release -czf "dist/lootsmith-${VER}-linux-x86_64.tar.gz" lootsmith-gui lootsmith
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak + runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build bundle
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          flatpak-builder --user --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.undeadbulwark.Lootsmith.yml
          flatpak build-bundle repo "dist/lootsmith-${VER}-x86_64.flatpak" \
            io.github.undeadbulwark.Lootsmith
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="lootsmith-${VER}/" \
            -o "dist/lootsmith-${VER}-src.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*

  release:
    needs: [linux, flatpak, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
