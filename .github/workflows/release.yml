name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev libssl-dev
      - name: Build
        run: cargo build --release -p lootsmith-gui -p lootsmith-cli
      - name: Tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C target/release -czf "dist/lootsmith-${VER}-linux-x86_64.tar.gz" lootsmith-gui lootsmith
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VER="${GITHUB_REF_NAME#v}"
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/lootsmith-gui AppDir/usr/bin/
          cp packaging/lootsmith.desktop AppDir/usr/share/applications/
          cp crates/lootsmith-gui/assets/lootsmith.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/lootsmith.png
          ./linuxdeploy --appdir AppDir --output appimage
          mv Lootsmith*.AppImage "dist/lootsmith-${VER}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p lootsmith-gui -p lootsmith-cli
      - name: Zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive target/release/lootsmith-gui.exe, target/release/lootsmith.exe `
            "dist/lootsmith-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="lootsmith-${VER}/" \
            -o "dist/lootsmith-${VER}-src.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*

  release:
    needs: [linux, windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
